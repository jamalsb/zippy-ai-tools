<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zippy AI - Layer Thumbnail Editor</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090d1b;color:white;font-family:Arial}
header{background:#11172b;padding:18px;display:flex;justify-content:space-between}
.logo{font-size:23px;font-weight:bold;color:#b18aff}
main{max-width:900px;margin:auto;padding:16px}
h1{text-align:center;color:#c2a5ff}
.panel{background:#151c32;padding:16px;border-radius:15px;margin:15px 0}
button{background:#8055e9;color:white;border:0;border-radius:8px;padding:12px;font-weight:bold;cursor:pointer}
button:active{opacity:.7}
input,select{width:100%;padding:11px;background:#0c1224;color:white;border:1px solid #424d6c;border-radius:8px}
textarea{width:100%;height:85px;padding:12px;background:#0c1224;color:white;border:1px solid #424d6c;border-radius:8px}
input[type=color]{height:43px;padding:3px}
input[type=range]{padding:0}
input[type=checkbox]{width:22px;height:22px}
label{display:block;margin:13px 0 7px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#canvas{width:100%;height:auto;display:block;background:#252344;border-radius:9px;touch-action:none;margin-top:12px}
.layer{background:#27314d;padding:10px;margin:7px 0;border-radius:8px;display:flex;align-items:center;justify-content:space-between;gap:5px}
.layer button{padding:8px}
.layer.active{outline:2px solid #a783ff}
.small{font-size:12px;color:#b7bfd2}
.full{width:100%;margin-top:10px}
.danger{background:#b72d46}
.secondary{background:#34415f}
footer{text-align:center;padding:25px;color:#9ca5ba}
@media(max-width:430px){.tools{grid-template-columns:repeat(2,1fr)}}
</style>
