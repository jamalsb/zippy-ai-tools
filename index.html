
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zippy AI Tools - Thumbnail Maker</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090d1b;color:white;font-family:Arial,sans-serif}
header{padding:20px;background:#11162a;border-bottom:1px solid #30334e}
.logo{font-size:25px;font-weight:bold;color:#ad91ff}
main{max-width:850px;margin:auto;padding:25px 16px}
h1{text-align:center;color:#c4a9ff}
p{text-align:center;color:#aeb6cb}
.panel{background:#151c32;padding:20px;border-radius:15px;margin:20px 0}
label{display:block;margin:17px 0 8px}
input,textarea{width:100%;padding:13px;border-radius:8px;border:1px solid #444c68;background:#0c1224;color:white;font-size:16px}
input[type=color]{height:48px;padding:4px}
button{padding:14px;border:0;border-radius:9px;background:#8055e9;color:white;font-weight:bold;font-size:16px;width:100%;margin-top:15px}
canvas{width:100%;border-radius:10px;background:#222;margin-top:15px}
footer{text-align:center;padding:25px;color:#929bb2}
</style>
</head>
<body>
<header><div class="logo">⚡ Zippy AI Tools</div></header>
<main>
<h1>YouTube Thumbnail Maker</h1>
<p>Create your own professional 1280 × 720 thumbnail.</p>

<div class="panel">
<label>Upload your image</label>
<input type="file" id="photo" accept="image/*">

<label>Thumbnail Title</label>
<textarea id="title" rows="2" placeholder="Write your video title">MY AWESOME VIDEO</textarea>

<label>Text Color</label>
<input type="color" id="color" value="#ffffff">

<label>Text Background Color</label>
<input type="color" id="bgcolor" value="#6c35df">

<label>Text Size</label>
<input type="range" id="size" min="35" max="110" value="70">

<button onclick="makeThumb()">Create Thumbnail</button>
<canvas id="canvas" width="1280" height="720"></canvas>
<button onclick="downloadThumb()">Download PNG</button>
</div>
</main>
<footer>© 2026 Zippy AI Tools</footer>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
let photo=null;

function makeThumb(){
ctx.clearRect(0,0,1280,720);

if(photo){
let scale=Math.max(1280/photo.width,720/photo.height);
let w=photo.width*scale;
let h=photo.height*scale;
ctx.drawImage(photo,(1280-w)/2,(720-h)/2,w,h);
}else{
let g=ctx.createLinearGradient(0,0,1280,720);
g.addColorStop(0,"#171b42");
g.addColorStop(1,"#7741cf");
ctx.fillStyle=g;
ctx.fillRect(0,0,1280,720);
}

ctx.fillStyle="rgba(0,0,0,0.30)";
ctx.fillRect(0,0,1280,720);

let title=document.getElementById("title").value || "MY VIDEO";
let lines=title.toUpperCase().split("\n");
let size=Number(document.getElementById("size").value);
ctx.font="bold "+size+"px Arial";
ctx.textAlign="center";
ctx.textBaseline="middle";

let lineHeight=size*1.25;
let total=lines.length*lineHeight;
let start=(720-total)/2;

lines.forEach((line,i)=>{
let y=start+i*lineHeight+lineHeight/2;
let width=Math.min(ctx.measureText(line).width+55,1180);
ctx.fillStyle=document.getElementById("bgcolor").value;
ctx.fillRect((1280-width)/2,y-lineHeight/2,width,lineHeight);
ctx.fillStyle=document.getElementById("color").value;
ctx.fillText(line,640,y,1150);
});
}

document.getElementById("photo").addEventListener("change",function(e){
let file=e.target.files[0];
if(!file)return;
let reader=new FileReader();
reader.onload=function(event){
photo=new Image();
photo.onload=makeThumb;
photo.src=event.target.result;
};
reader.readAsDataURL(file);
});

function downloadThumb(){
makeThumb();
let link=document.createElement("a");
link.download="zippy-thumbnail.png";
link.href=canvas.toDataURL("image/png");
link.click();
}
makeThumb();
</script>
</body>
</html>
